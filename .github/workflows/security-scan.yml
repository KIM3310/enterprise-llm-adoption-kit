name: security-scan

on:
  push:
    branches: [main]
    paths:
      - "app/backend/**"
      - ".github/workflows/security-scan.yml"
  pull_request:
    paths:
      - "app/backend/**"
      - ".github/workflows/security-scan.yml"
  schedule:
    # Weekly scan on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/backend/requirements.txt
          python -m pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --strict --desc on -r app/backend/requirements.txt

  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install bandit
        run: python -m pip install bandit[toml]

      - name: Run bandit security scan
        run: >
          bandit -r app/backend/app/
          --severity-level medium
          --confidence-level medium
          --format json
          --output bandit-report.json
          || true

      - name: Display findings
        if: always()
        run: |
          python -m pip install bandit[toml]
          bandit -r app/backend/app/ --severity-level medium --confidence-level medium || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
