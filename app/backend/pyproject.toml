[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-llm-adoption-kit-backend"
version = "0.1.0"
description = "Enterprise adoption kit backend with governance, review surfaces, and evaluation tooling."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kim" }]
license = { text = "MIT" }
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.52.4",
  "boto3==1.43.79",
  "pydantic==2.13.4",
  "pyjwt==2.13.0",
  "chromadb==0.6.3",
  "numpy==1.26.4",
  "prometheus_client==0.26.0",
  "requests==2.34.2",
  "httpx==0.28.1",
  "urllib3==2.7.0",
  "cryptography==50.0.0",
  "pyOpenSSL==26.4.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "snowflake-connector-python==4.7.2",
]
databricks = [
  "mlflow-skinny==3.15.1",
  "GitPython==3.1.59",
  "databricks-sdk==0.133.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../../tests", "tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=75"
filterwarnings = [
  "ignore:Type google\\._upb\\._message\\..*:DeprecationWarning",
]
