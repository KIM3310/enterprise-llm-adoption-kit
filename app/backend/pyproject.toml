[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-llm-adoption-kit-backend"
version = "0.1.0"
description = "Enterprise adoption kit backend with governance, review surfaces, and evaluation tooling."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kim" }]
license = { text = "MIT" }
dependencies = [
  "fastapi==0.136.3",
  "starlette==1.3.1",
  "uvicorn[standard]==0.27.1",
  "boto3==1.42.90",
  "pydantic==2.13.2",
  "pyjwt==2.13.0",
  "chromadb==0.4.24",
  "numpy==1.26.4",
  "prometheus_client==0.20.0",
  "requests==2.33.1",
  "httpx==0.27.2",
  "urllib3==2.7.0",
  "cryptography==49.0.0",
  "pyOpenSSL==26.3.0",
  "opentelemetry-api==1.41.0",
  "opentelemetry-sdk==1.41.0",
  "opentelemetry-instrumentation-fastapi==0.62b0",
  "opentelemetry-exporter-otlp-proto-http==1.41.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "snowflake-connector-python==4.4.0",
]
databricks = [
  "mlflow-skinny==3.11.1",
  "databricks-sdk==0.105.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../../tests", "tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=75"
filterwarnings = [
  "ignore:Type google\\._upb\\._message\\..*:DeprecationWarning",
]
