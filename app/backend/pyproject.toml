[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-llm-adoption-kit-backend"
version = "0.1.0"
description = "Enterprise adoption kit backend with governance, review surfaces, and evaluation tooling."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kim" }]
license = { text = "MIT" }
dependencies = [
  "fastapi==0.136.3",
  "uvicorn[standard]==0.48.0",
  "boto3==1.43.18",
  "pydantic==2.13.4",
  "pyjwt==2.13.0",
  "chromadb==1.5.9",
  "numpy==2.4.6",
  "prometheus_client==0.25.0",
  "requests==2.34.2",
  "httpx==0.28.1",
  "urllib3==2.7.0",
  "cryptography==48.0.0",
  "pyOpenSSL==26.2.0",
  "opentelemetry-api==1.42.1",
  "opentelemetry-sdk==1.42.1",
  "opentelemetry-instrumentation-fastapi==0.63b1",
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "snowflake-connector-python==4.6.0",
]
databricks = [
  "mlflow==3.12.0",
  "databricks-sdk==0.112.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../../tests", "tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=75"
filterwarnings = [
  "ignore:Type google\\._upb\\._message\\..*:DeprecationWarning",
]
