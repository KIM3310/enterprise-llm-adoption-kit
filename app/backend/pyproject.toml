[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-llm-adoption-kit-backend"
version = "0.1.0"
description = "Enterprise adoption kit backend with governance, review surfaces, and evaluation tooling."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kim" }]
license = { text = "MIT" }
dependencies = [
  "fastapi==0.121.3",
  "uvicorn[standard]==0.27.1",
  "pydantic==2.12.5",
  "pyjwt==2.8.0",
  "chromadb==0.4.22",
  "numpy==1.26.4",
  "prometheus_client==0.20.0",
  "requests==2.31.0",
  "httpx==0.27.2",
  "pytest==8.0.0",
  "urllib3<2",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-exporter-otlp>=1.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../../tests", "tests"]
addopts = "-q"
